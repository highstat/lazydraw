name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.bin_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bin_name: lazydraw-darwin-arm64
          - os: ubuntu-latest
            bin_name: lazydraw-linux-x64
          - os: windows-latest
            bin_name: lazydraw-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build standalone binary
        shell: bash
        run: |
          mkdir -p dist
          bun build src/cli.ts --compile \
            --external '@opentui/core-*-musl' \
            --external '@opentui/core-darwin-x64' \
            --external '@opentui/core-win32-arm64' \
            --external '@opentui/core-linux-arm64' \
            --outfile dist/${{ matrix.bin_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: dist/${{ matrix.bin_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release binaries
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec mv {} release-dist/ \;
          ls -lh release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-dist/*
          generate_release_notes: true
