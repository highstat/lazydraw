name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            bin_name: lazydraw-darwin-arm64
          - os: macos-13
            target: darwin-x64
            bin_name: lazydraw-darwin-x64
          - os: ubuntu-latest
            target: linux-x64
            bin_name: lazydraw-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            bin_name: lazydraw-linux-arm64
          - os: windows-latest
            target: windows-x64
            bin_name: lazydraw-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build standalone binary
        shell: bash
        run: |
          mkdir -p dist
          bun build src/cli.ts --compile --outfile dist/${{ matrix.bin_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: dist/${{ matrix.bin_name }}

  release:
    name: Create GitHub Release & Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release binaries
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec mv {} release-dist/ \;
          ls -lh release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-dist/*
          generate_release_notes: true

      - name: Setup Node for npm publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm (if NPM_TOKEN is configured)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            echo "NPM_TOKEN secret is not set, skipping automatic npm publish."
          fi
